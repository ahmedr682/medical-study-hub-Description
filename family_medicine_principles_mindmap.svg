<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#2C221E}.head{font-size:34px;font-weight:700}.sub{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px}
</style></defs><rect width="1600" height="1100" fill="#FAF5EB"/>
<rect x="500" y="35" width="600" height="110" rx="24" fill="#2A6F62"/><text x="800" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">FAMILY MEDICINE</text><text x="800" y="120" text-anchor="middle" font-family="Arial" font-size="23" fill="white">Principles &amp; Concepts</text>
<path d="M800 145 V190 M265 190 H1335 M265 190 V225 M800 190 V225 M1335 190 V225" stroke="#8C7968" stroke-width="5" fill="none"/>
<rect x="45" y="225" width="440" height="245" rx="20" fill="#E9CD92" stroke="#C85A32" stroke-width="2"/><text class="t sub" x="265" y="270" text-anchor="middle">DEFINITION &amp; SCOPE</text><text class="t body" x="75" y="315">• Continuing + comprehensive care</text><text class="t body" x="75" y="355">• Individual and family</text><text class="t body" x="75" y="395">• All ages and both genders</text><text class="t body" x="75" y="435">• Every organ system and disease</text>
<rect x="580" y="225" width="440" height="245" rx="20" fill="#C7DCD7" stroke="#2A6F62" stroke-width="2"/><text class="t sub" x="800" y="270" text-anchor="middle">PRIMARY CARE</text><text class="t body" x="615" y="315">• First contact / entry point</text><text class="t body" x="615" y="355">• Continuity + comprehensiveness</text><text class="t body" x="615" y="395">• Coordination + follow-up</text><text class="t body" x="615" y="435">• Personalized care</text>
<rect x="1115" y="225" width="440" height="245" rx="20" fill="#E9CD92" stroke="#C85A32" stroke-width="2"/><text class="t sub" x="1335" y="270" text-anchor="middle">FAMILY PHYSICIAN</text><text class="t body" x="1150" y="315">• Continuing responsibility</text><text class="t body" x="1150" y="355">• Comprehensive + interpersonal</text><text class="t body" x="1150" y="395">• Accessible + diagnostician</text><text class="t body" x="1150" y="435">• Coordinator of care</text>
<path d="M265 470 V520 H800 V550 M800 470 V550 M1335 470 V520 H800" stroke="#8C7968" stroke-width="5" fill="none"/>
<rect x="45" y="550" width="440" height="230" rx="20" fill="#fff" stroke="#2A6F62" stroke-width="3"/><text class="t sub" x="265" y="595" text-anchor="middle">PATIENT-CENTRED CARE</text><text class="t body" x="75" y="640">1. Minimize distractions</text><text class="t body" x="75" y="680">2. Active listening</text><text class="t body" x="75" y="720">3. Non-verbal cues</text><text class="t body" x="75" y="760">4. Feedback + allow correction</text>
<rect x="580" y="550" width="440" height="230" rx="20" fill="#C7DCD7" stroke="#2A6F62" stroke-width="3"/><text class="t sub" x="800" y="595" text-anchor="middle">SPECIAL PATIENTS</text><text class="t body" x="615" y="650">• Anxious: explore + reassure</text><text class="t body" x="615" y="700">• Angry: calm + validate</text><text class="t body" x="615" y="750">• Pain: empathize + gentle exam</text>
<rect x="1115" y="550" width="440" height="230" rx="20" fill="#fff" stroke="#C85A32" stroke-width="3"/><text class="t sub" x="1335" y="595" text-anchor="middle">COUNSELLING · FIVE A's</text><text class="t body" x="1150" y="650">1. Ask</text><text class="t body" x="1150" y="690">2. Advise · 3. Assess</text><text class="t body" x="1150" y="730">4. Assist · 5. Arrange</text><text class="t small" x="1150" y="765">Example in PDF: smoking cessation</text>
<rect x="240" y="850" width="1120" height="170" rx="22" fill="#FBF8F1" stroke="#D9CEBE" stroke-width="2"/><text class="t sub" x="800" y="900" text-anchor="middle">CLINICAL TAKE-HOME</text><text class="t body" x="800" y="950" text-anchor="middle">Treat the person over time — not just the disease today.</text><text class="t body" x="800" y="990" text-anchor="middle">Listen, understand context, coordinate care and follow up.</text>
</svg>